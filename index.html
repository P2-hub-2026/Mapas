<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestão Territorial - Multi-Congregação</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de Filtros -->
  <header id="top-bar">
    <select id="filtro-congregacao" onchange="renderizarMapa()">
      <option value="Jardins">Congregação Jardins</option>
      <option value="Central">Congregação Central</option>
      <option value="BelaVista">Congregação BelaVista</option>
    </select>

    <select id="filtro-status" onchange="renderizarMapa()">
      <option value="TODOS">Todos os Status</option>
      <option value="Livre">Livres</option>
      <option value="Designado">Designados</option>
      <option value="Trabalhando">Trabalhando</option>
      <option value="Concluído">Concluídos</option>
    </select>

    <button id="btn-gps" onclick="ativarGPS()">📍 GPS</button>
  </header>

  <!-- Container do Mapa -->
  <div id="map"></div>

  <!-- Ficha do Território (Estilo Hourglass) -->
  <div id="painel-detalhes" class="painel oculto">
    <button class="btn-fechar" onclick="fecharPainel()">✕</button>
    
    <div class="painel-cabecalho">
      <h2 id="detalhe-codigo">---</h2>
      <span id="detalhe-tag-status" class="badge">---</span>
    </div>

    <div class="info-grid">
      <p><strong>Congregação:</strong> <span id="detalhe-congregacao">---</span></p>
      <p><strong>Designado a:</strong> <span id="detalhe-publicador">Ninguém</span></p>
      <p><strong>Data de Saída:</strong> <span id="detalhe-saida">--/--/----</span></p>
      <p><strong>Última Conclusão:</strong> <span id="detalhe-conclusao">--/--/----</span></p>
      <p><strong>Pontos Registrados:</strong> <span id="detalhe-qtd-pontos">0</span></p>
    </div>
    
    <hr>
    
    <!-- Controles de Status -->
    <div class="painel-acoes">
      <button id="btn-designar" onclick="acaoDesignar()">📋 Designar</button>
      <button id="btn-trabalhar" onclick="alterarStatus('Trabalhando')">🚶 Em Campo</button>
      <button id="btn-concluir" onclick="alterarStatus('Concluído')">✅ Concluir</button>
      <button id="btn-liberar" onclick="alterarStatus('Livre')">🔄 Liberar</button>
    </div>

    <!-- Navegação e Marcações -->
    <div class="painel-acoes-secundarias">
      <button id="btn-maps" onclick="abrirNoGoogleMaps()">🗺️ Ver no Maps</button>
      <button id="btn-rota" onclick="tracarRotaAteTerritorio()">🚗 Rota até Território</button>
      <button id="btn-add-ponto" onclick="alternarModoMarcacao()">📍 Marcar Ponto</button>
    </div>

    <!-- Lista de Endereços/Notas -->
    <div id="secao-pontos" class="secao-pontos">
      <h4>Pontos & Notas do Território</h4>
      <ul id="lista-pontos"></ul>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
